version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    versioning-strategy: 'auto'
    allow:
      - dependency-type: 'all'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'norelease'
    # Held until the lint plugins catch up: typescript-eslint peers on typescript <6.1, and
    # eslint-plugin-obsidianmd peers on @eslint/js ^9. Drop each entry once its peer range allows it.
    ignore:
      - dependency-name: 'typescript'
        versions: ['>=7.0.0']
      - dependency-name: '@eslint/js'
        versions: ['>=10.0.0']
    groups:
      dev-dependencies:
        patterns:
          - '@eslint/*'
          - '@types/*'
          - 'eslint*'
          - 'typescript*'
          - 'prettier'
          - 'esbuild'
          - 'globals'
          - 'jiti'
        update-types:
          - 'minor'
          - 'patch'
      runtime-dependencies:
        patterns:
          - 'obsidian'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'github-actions'
      - 'norelease'
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
