name: Check version labels

on:
  pull_request:
    types: [opened, labeled, unlabeled, synchronize, reopened]

jobs:
  check-labels:
    name: Enforce semantic versioning
    runs-on: ubuntu-26.04
    steps:
      - name: Check for version labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Exactly one, so a leftover semver label can't release a PR also marked norelease.
            const versionLabels = ['major', 'minor', 'patch', 'norelease'];
            const present = context.payload.pull_request.labels
              .map((l) => l.name)
              .filter((l) => versionLabels.includes(l));

            if (present.length !== 1) {
              core.setFailed(
                `PR must have exactly one of: ${versionLabels.join(', ')}; found: ${present.join(', ') || 'none'}`,
              );
            }
