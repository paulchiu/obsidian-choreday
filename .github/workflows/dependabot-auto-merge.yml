name: Dependabot auto-merge

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    name: Merge eligible Dependabot PRs once CI passes
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-26.04
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'

      - name: Check every update is non-breaking
        id: eligible
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          UPDATES: ${{ steps.metadata.outputs.updated-dependencies-json }}
        with:
          result-encoding: string
          script: |
            // Under semver a 0.x minor (and a 0.0.x patch) is breaking, so compare versions rather
            // than trust update-type. An unreadable version fails closed.
            const parse = (version) => version?.match(/^v?(\d+)(?:\.(\d+))?(?:\.(\d+))?/)?.slice(1, 4);
            const isBreaking = ({ dependencyName, prevVersion, newVersion }) => {
              const prev = parse(prevVersion);
              const next = parse(newVersion);
              const breaking =
                !prev ||
                !next ||
                prev[0] !== next[0] ||
                (prev[0] === '0' && prev[1] !== next[1]) ||
                (prev[0] === '0' && prev[1] === '0' && prev[2] !== next[2]);
              if (breaking) core.info(`${dependencyName} ${prevVersion} -> ${newVersion} needs review`);
              return breaking;
            };
            const updates = JSON.parse(process.env.UPDATES || '[]');
            return String(updates.length > 0 && !updates.some(isBreaking));

      - name: Wait for CI
        id: ci
        if: steps.eligible.outputs.result == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          result-encoding: string
          script: |
            // main requires no status checks (the release job pushes to it directly), so this job
            // is the gate: merge only once the latest run of each check has passed.
            const required = ['Lint, Format & Build', 'Enforce semantic versioning'];
            const { owner, repo } = context.repo;
            const ref = context.payload.pull_request.head.sha;
            const latest = (runs, name) =>
              runs
                .filter((run) => run.name === name)
                .sort((a, b) => new Date(b.started_at) - new Date(a.started_at))[0];
            for (let attempt = 0; attempt < 60; attempt++) {
              const runs = await github.paginate(github.rest.checks.listForRef, { owner, repo, ref });
              const pending = runs.some((run) => required.includes(run.name) && run.status !== 'completed');
              const results = required.map((name) => latest(runs, name));
              if (!pending && results.every(Boolean)) {
                const failed = results.filter((run) => run.conclusion !== 'success');
                failed.forEach((run) => core.info(`${run.name}: ${run.conclusion}`));
                return String(failed.length === 0);
              }
              await new Promise((resolve) => setTimeout(resolve, 20_000));
            }
            core.info('Timed out waiting for CI.');
            return 'false';

      - name: Merge
        if: steps.ci.outputs.result == 'true'
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
